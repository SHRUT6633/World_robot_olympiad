<text x="880" y="235" fill="#333" font-family="monospace" font-size="8">• UART: 115200 baud, 8N1, 3.3V logic</text>
<text x="880" y="250" fill="#333" font-family="monospace" font-size="8">• I2C: 400 kHz, pull-ups 4.7k Ohm</text>
<text x="880" y="265" fill="#333" font-family="monospace" font-size="8">• ToF XSHUT: active-low, Pi controls</text>
<text x="880" y="280" fill="#333" font-family="monospace" font-size="8">• Motor: L298N ENA=GPIO11 PWM</text>
<text x="880" y="295" fill="#333" font-family="monospace" font-size="8">• Servo: MG995, 50 Hz, 1-2ms pulse</text>
<text x="880" y="310" fill="#333" font-family="monospace" font-size="8">• Battery: 3S LiPo 11.1V -&gt; L298N</text>
<text x="880" y="325" fill="#333" font-family="monospace" font-size="8">• L298N 5V output -&gt; Pi VIN</text>
<text x="880" y="340" fill="#333" font-family="monospace" font-size="8">• BEC 5V/3A -&gt; Servo power</text>
<text x="880" y="355" fill="#333" font-family="monospace" font-size="8">• LEDs: 100 Ohm series resistor</text>
<text x="880" y="370" fill="#333" font-family="monospace" font-size="8">• Switch: pull-up, press=GND</text>
<text x="880" y="385" fill="#333" font-family="monospace" font-size="8">• All GNDs tied to common rail</text>
<text x="880" y="400" fill="#333" font-family="monospace" font-size="8">• Pi &amp; ESP share ground only</text>
